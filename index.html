<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Placar Passa ou Repassa - Micro:bit</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #00d2ff; }
    button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; }
    button:hover { background: #218838; }
    .placar { display: flex; justify-content: center; gap: 40px; margin-top: 40px; }
    .time { border: 4px solid #444; padding: 30px; border-radius: 15px; width: 250px; background: #1e1e1e; }
    .time-a { border-color: #28a745; }
    .time-b { border-color: #ffc107; }
    .pontos { font-size: 5rem; font-weight: bold; margin: 20px 0; }
    .status { margin-top: 20px; font-size: 1.2rem; color: #aaa; }
    .revelador { font-size: 2.2rem; font-weight: bold; margin-top: 20px; height: 60px; }
  </style>
</head>
<body>

  <h1>PASSA OU REPASSA - MICRO:BIT</h1>
  <button id="btnConectar">🔌 Conectar Micro:bit (USB)</button>
  
  <div class="status" id="status">Status: Desconectado</div>
  <div class="revelador" id="quemBateu">Aguardando início...</div>

  <div class="placar">
    <div class="time time-a">
      <h2>EQUIPE A</h2>
      <div class="pontos" id="placarA">0</div>
    </div>
    <div class="time time-b">
      <h2>EQUIPE B</h2>
      <div class="pontos" id="placarB">0</div>
    </div>
  </div>

  <script>
    let pontosA = 0;
    let pontosB = 0;

    document.getElementById('btnConectar').addEventListener('click', async () => {
      // Verifica se o navegador suporta Web Serial
      if (!("serial" in navigator)) {
        alert("Seu navegador não suporta a Web Serial API. Use o Google Chrome ou Microsoft Edge no computador.");
        return;
      }

      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        document.getElementById('status').innerText = "Status: Micro:bit Conectado!";
        document.getElementById('status').style.color = "#28a745";
        document.getElementById('btnConectar').style.display = "none";

        // Leitor de fluxo linha a linha com suporte a \n
        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable
          .pipeThrough(new TransformStream(new LineBreakTransformer()))
          .getReader();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) {
            tratarMensagem(value.trim());
          }
        }
      } catch (error) {
        document.getElementById('status').innerText = "Erro ao conectar: " + error;
        document.getElementById('status').style.color = "#dc3545";
      }
    });

    // Classe para juntar pedaços de texto até achar o \n
    class LineBreakTransformer {
      constructor() {
        this.chunks = "";
      }
      transform(chunk, controller) {
        this.chunks += chunk;
        const lines = this.chunks.split("\n");
        this.chunks = lines.pop();
        lines.forEach(line => controller.enqueue(line));
      }
      flush(controller) {
        controller.enqueue(this.chunks);
      }
    }

    function tratarMensagem(msg) {
      const displayQuemBateu = document.getElementById('quemBateu');
      
      if (msg.includes("RESET")) {
        displayQuemBateu.innerText = "🔔 RODADA LIBERADA!";
        displayQuemBateu.style.color = "#00d2ff";
      } else if (msg.includes("A")) {
        pontosA++;
        document.getElementById('placarA').innerText = pontosA;
        displayQuemBateu.innerText = "⚡ EQUIPE A BATEU PRIMEIRO!";
        displayQuemBateu.style.color = "#28a745";
      } else if (msg.includes("B")) {
        pontosB++;
        document.getElementById('placarB').innerText = pontosB;
        displayQuemBateu.innerText = "⚡ EQUIPE B BATEU PRIMEIRO!";
        displayQuemBateu.style.color = "#ffc107";
      }
    }
  </script>
</body>
</html>
